services:
  - type: web
    name: college-special-attendance
    runtime: node
    plan: free
    region: oregon
    buildCommand: "npm run deploy:build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_DEFAULT_EMAIL
        value: Dean@coer.edu
      - key: ADMIN_DEFAULT_PASSWORD
        value: Dean@1111
      - key: DATABASE_URL
        fromDatabase:
          name: college-attendance-db
          property: connectionString

databases:
  - name: college-attendance-db
    plan: free
    region: oregon
